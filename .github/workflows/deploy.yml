name: Deploy na VPS
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy-crm
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, exito-vps]
    timeout-minutes: 60
    steps:
      - name: Deploy (backup, pull, build, restart, health check, rollback)
        run: sudo /usr/local/bin/deploy-crm
