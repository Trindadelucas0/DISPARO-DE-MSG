# Postgres isolado — só máquina nova SEM o volume crm_pg_data.
# A VPS em /opt/disparo-de-msg usa docker-compose.vps.yml (volume crm_pg_data).
# Este arquivo cria crm_postgres_data: subir na VPS atual = banco vazio.
#
# Windows local onde a 5432 pertence ao serviço nativo postgresql-x64-18: defina
# CRM_DB_PORT no .env (ex.: 5442) e suba junto do Redis/worker com
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# (ou COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml no .env).
# A porta dentro do container segue 5432: só a publicada muda.

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_prospeccao
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:?defina CRM_DB_PASSWORD no .env}
    ports:
      - '127.0.0.1:${CRM_DB_PORT:-5432}:5432'
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_prospeccao']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  crm_postgres_data:
    name: crm_postgres_data
