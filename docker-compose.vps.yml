# Infra da VPS: Postgres + Redis + worker Baileys.
#
# O Next.js NÃO sobe aqui. Ele roda no host via systemd ou PM2 (`npm start`, porta 3001).
# Uso: docker compose -f docker-compose.vps.yml up -d
# Ou, no .env da VPS (não versionado): COMPOSE_FILE=docker-compose.vps.yml
#     e então `docker compose up -d` continua válido.
#
# Não use docker-compose.yml (Windows, Redis 6380) nem docker-compose.postgres.yml
# nesta máquina: volume e porta diferentes. Volumes desta VPS: crm_pg_data, crm_redis_data.
#
# Nunca rode `npm run worker` no host ao mesmo tempo que o container crm-worker:
# os dois brigam pelo lock Redis da sessão WhatsApp.

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm_prospeccao}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - crm_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: crm-worker
    container_name: crm-worker
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CRM_WORKER_IN_DOCKER: '1'
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_prospeccao}?schema=public
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data/whatsapp-auth:/app/data/whatsapp-auth
      - ./data/media:/app/data/media
      - ./src:/app/src
      - ./workers:/app/workers
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json

volumes:
  crm_pg_data:
    name: crm_pg_data
  crm_redis_data:
    name: crm_redis_data
