# Redis + worker Baileys — Windows local.
#
# O Next.js continua na máquina (`npm run dev` / PM2, porta 3001).
# Postgres no Windows: nativo (postgresql-x64-18, 5432).
# Na VPS use docker-compose.vps.yml (Postgres + Redis 6379, volume crm_pg_data).
# Não use este arquivo na VPS: Redis aqui é 6380.
#
# A porta 6379 pertence ao container `samuel-redis` e a 5433 ao `samuel-postgres`, ambos de outro
# projeto. Este compose publica Redis em 127.0.0.1:6380 e usa volume nomeado próprio para não colidir.
#
# Uso: docker compose up -d
# Worker local (`npm run worker`) e o container crm-worker não podem rodar juntos: lock Redis.

services:
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6380:6379'
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - crm_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: crm-worker
    container_name: crm-worker
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CRM_WORKER_IN_DOCKER: '1'
      REDIS_URL: redis://redis:6379
      CRM_DOCKER_DB_HOST: ${CRM_DOCKER_DB_HOST:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data/whatsapp-auth:/app/data/whatsapp-auth
      - ./data/media:/app/data/media
      - ./src:/app/src
      - ./workers:/app/workers
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json

volumes:
  crm_redis_data:
    name: crm_redis_data
